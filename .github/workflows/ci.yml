# Compile the TWSUGamerPlus sketch for Arduino Uno (ATmega328P).
# Runs on every push and pull request to catch regressions early.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  compile-sketch:
    name: Compile (arduino:avr:uno)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install AVR core
        run: arduino-cli core install arduino:avr

      - name: Compile sketch and report memory usage
        # arduino-cli prints "Sketch uses X bytes … Global variables use Y bytes …"
        # Use pipefail so a compile error is not masked by tee.
        shell: bash
        run: |
          set -o pipefail
          arduino-cli compile \
            --fqbn arduino:avr:uno \
            --warnings all \
            . 2>&1 | tee /tmp/build.log
          grep -E "Sketch uses|Global variables" /tmp/build.log || true
